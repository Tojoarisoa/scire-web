<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">SCIRE tech stack</title>
<desc id="d">The page runs in the browser: plain HTML, CSS and JavaScript, a service worker that keeps it working offline, an offline engine, a progress map built with React and React Flow, an on-device AI using WebLLM on WebGPU and WebAssembly, and Python in the browser through Pyodide. It talks to a SCIRE server over HTTPS and JSON.</desc>
